<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>University Finder</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>🎓 University Finder</h1>
      <p>Find the best universities matching your GPA and preferences</p>
    </header>

    <div class="filters">
      <div class="filter-group">
        <label for="gpa">Your GPA (0.0 - 4.0)</label>
        <input type="number" id="gpa" min="0" max="4" step="0.01" placeholder="e.g., 3.5" value="3.5">
      </div>

      <div class="filter-group">
        <label for="country">Country</label>
        <select id="country">
          <option value="all">All Countries</option>
          <option value="USA">USA</option>
          <option value="UK">UK</option>
          <option value="Canada">Canada</option>
          <option value="Australia">Australia</option>
          <option value="Germany">Germany</option>
          <option value="Singapore">Singapore</option>
        </select>
      </div>

      <div class="filter-group">
        <label for="major">Major</label>
        <select id="major">
          <option value="all">All Majors</option>
          <option value="Computer Science">Computer Science</option>
          <option value="Engineering">Engineering</option>
          <option value="Business">Business</option>
          <option value="Medicine">Medicine</option>
          <option value="Law">Law</option>
          <option value="Arts">Arts</option>
        </select>
      </div>

      <div class="filter-group">
        <label for="sort">Sort By</label>
        <select id="sort">
          <option value="match">Best Match</option>
          <option value="rank">World Ranking</option>
          <option value="country">Country</option>
          <option value="name">Name (A-Z)</option>
        </select>
      </div>

      <button class="search-btn" onclick="findUniversities()">🔍 Find Universities</button>
    </div>

    <div class="results">
      <h2 id="resultsTitle">Top Universities</h2>
      <div id="universityList"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
